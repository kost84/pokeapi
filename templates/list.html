{{define "list"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Pokédex – Tyradex</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <h1>Pokédex Tyradex</h1>
  <form action="/pokemon" method="get" class="search">
    <input type="search" name="nom" value="{{.Search}}" placeholder="Rechercher un Pokémon">
    <button type="submit">Rechercher</button>
  </form>
  <ul class="grid">
    {{range .Pokemon}}
      <li class="card">
        <a href="/pokemon/{{.ID}}">
          <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}">
          <strong>n° {{.ID}} - {{.Name.Fr}}</strong>
        </a>
      </li>
    {{else}}
      <li>Aucun Pokémon ne correspond à « {{.Search}} ».</li>
    {{end}}
  </ul>
  <footer>Données : Tyradex API (https://tyradex.app/docs)</footer>
</body>
</html>
{{end}}
