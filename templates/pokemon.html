{{define "Pokemon"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{{.Name}} – Pokemon &amp; Tyradex</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="/pokemon">← Retour à la liste</a>
  <h1>{{.pokedexId}} - {{.Name.Fr}}</h1>
  <img src="{{.Sprite.Regular}}" alt="{{.Name.fr}}">
  <p>Catégorie : {{.Categorie}} | Génération : {{.Generation}}
  </p>
  <div>
  <strong>Type : </strong>
  {{.range Type}}
    <spam class="type">
         <img src="{{.Image}}" alt="{{.Name}}" width="24">
         {{.Name}}
    </spam>
    {{end}}
  </div>
  <footer>Données : Tyradex API (https://tyradex.app/docs/pokemon/pokedex)</footer>
</body>
</html>
{{end}}
