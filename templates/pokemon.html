{{define "pokemon"}}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{{.Name.Fr}} – Pokédex</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <a href="/pokemon">← Retour à la liste</a>
  <h1>n° {{.ID}} - {{.Name.Fr}}</h1>
  <img src="{{.Sprites.Regular}}" alt="{{.Name.Fr}}">
  <p>Catégorie : {{.Category}}</p>
  <div>
    <strong>Types : </strong>
    {{range .Types}}
      <span class="type">
        <img src="{{.Image}}" alt="{{.Name}}" width="24">
        {{.Name}}
      </span>
    {{end}}
  </div>
  <footer>Données : Tyradex API (https://tyradex.app/docs)</footer>
</body>
</html>
{{end}}
